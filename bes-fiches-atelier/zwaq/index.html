<style>
/* Layout : barre d'onglets produits, puis deux colonnes — tableaux éditables à gauche, bilan de coût collant à droite */

tr.click{cursor:pointer} tr.click:hover td{background:var(--accent-soft)}
td.txt{font-size:13px;white-space:nowrap} td.r{text-align:right;font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}

.lockbtn{font:500 12.5px var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
nav.sub{border-bottom:0;margin:0 0 10px;padding:0}
.lab{display:inline-block;min-width:24px;text-align:center;border:1.5px solid currentColor;border-radius:999px;padding:0 6px;font:700 12px var(--f-body)}
.atl-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:12px;margin-bottom:16px}
@media (max-width:760px){.atl-head{grid-template-columns:minmax(0,1fr)}}
.planbox{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;align-items:center;justify-content:center;min-height:160px}
.planbox img{max-height:340px;object-fit:contain}
.plates{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin:8px 0 14px}
.plate{background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px;color:#222}
.pcap{font:600 12px var(--f-body);margin-bottom:4px}
h3.mh{font:600 14px var(--f-body);margin:10px 0 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.warnline{color:var(--bad);font-size:13px;margin:6px 0}
label.ck{flex-direction:row!important;align-items:center;gap:8px!important;color:var(--ink)!important}
label.ck input{width:auto}
#printArea{display:none}
#printArea .sheet{font-family:"IBM Plex Sans","IBM Plex Sans Arabic",sans-serif;color:#000;background:#fff}
.ph{display:flex;gap:14px;align-items:baseline;border-bottom:2px solid #A8461F;padding-bottom:4px;margin-bottom:6px;font-size:11px}
.ph b{color:#A8461F;font-size:16px;letter-spacing:.04em}.ph .pt{font-weight:700;font-size:13px;flex:1}
.pps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3mm;margin-bottom:3mm}

#printArea h4{margin:2mm 0 1.5mm;font-size:12.5px}#printArea h4 small{font-weight:400;color:#444;margin-left:6px;font-size:10px}
.dt{width:100%;border-collapse:collapse;font-size:10.5px}.dt th,.dt td{border:1px solid #888;padding:1.1mm 1.5mm}
.dt th{background:#F4ECE1;font-size:9px;text-align:left}.dt .r{text-align:right}.dt .b{font-weight:700;font-size:12.5px}.dt .bx{width:8mm}
.dt tfoot td{font-weight:700}

<div class="wrap">
  <header>
    <h1><small>ZWAQ DECO · BOIS ECO-STYLE</small>Fiches atelier &amp; coûts</h1>
    <div class="hdr-r"><a class="lnk" href="../">← BES Fiches atelier</a><span id="lockBox"></span>
    <div class="status" id="status" role="status"><span class="dot" id="dot"></span><span id="statusText">Connexion…</span></div></div>
  </header>
  <nav id="tabs" role="tablist" aria-label="Produits"></nav>
  <div id="view"><div class="empty">Chargement des fiches produits…</div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s);
const el=(t,a={},...kids)=>{const e=document.createElement(t);for(const[k,v]of Object.entries(a)){if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(v!==undefined&&v!==null)e.setAttribute(k,v)}for(const c of kids.flat())if(c!=null)e.append(c.nodeType?c:document.createTextNode(c));return e};
const fmt=n=>(isFinite(n)?n:0).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=n=>(isFinite(n)?n:0).toLocaleString("fr-FR",{maximumFractionDigits:0});
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:0};

const DEF_MATS=[{nom:"Blanc",ep:18,L:2800,H:2100,prix:700},{nom:"Noyer",ep:18,L:2800,H:2100,prix:850},{nom:"L31",ep:18,L:2800,H:2100,prix:0},{nom:"Sonoma",ep:18,L:2800,H:2100,prix:0},{nom:"MDF brut",ep:18,L:2800,H:2100,prix:0}];
const DEF_PRIX={chantNL:1,chantNl:2,livraison:30,chute:15,chant22:2,chant40:3,cnc:80,mo:30,tva:20};
function MATS(){return Array.isArray(prix.matieres)&&prix.matieres.length?prix.matieres:DEF_MATS.map(m=>({...m,prix:m.nom==="Blanc"?(prix.plaqueBlanc??700):m.nom==="Noyer"?(prix.plaqueNoyer??850):0}))}
function matOf(nom){return MATS().find(m=>m.nom===nom)}
function m2Price(nom){const m=matOf(nom);if(!m)return 0;const s=num(m.L)*num(m.H)/1e6;return s?num(m.prix)/s:0}
function plateM2(nom){const m=matOf(nom);return m?num(m.L)*num(m.H)/1e6:0}
function priceOf(p,t){if(p.prix&&p.prix[t]!=null)return num(p.prix[t]);return t==="Blanc"?num(p.prixBlanc):t==="Noyer"?num(p.prixNoyer):0}
function CAT(){return Array.isArray(prix.fournitures)?prix.fournitures:[]}
function catOf(n){return n?CAT().find(c=>c.article===n):null}
function puOf(f){const c=catOf(f.cat);return c?num(c.pu):num(f.pu)}
const isAutoCh=r=>(r.chant22==null||r.chant22==="")&&(r.chant40==null||r.chant40==="");
function chAuto(r){return (num(prix.chantNL??1)*num(r.long)+num(prix.chantNl??2)*num(r.larg))/1000}
function ch22(r){return isAutoCh(r)?chAuto(r):num(r.chant22)}
function ch40(r){return isAutoCh(r)?0:num(r.chant40)}
function resolveMat(r,teinte){return r.matiere==="Teinte"?teinte:r.matiere}
const PRIX_FIELDS=[["livraison","Livraison par défaut (DH/unité)"],["chute","Chute / casse (%)"],["chant22","Bande de chant 22 mm (DH/m)"],["chant40","Bande de chant 40 mm (DH/m)"],["chantNL","Chant auto : nombre de longueurs"],["chantNl","Chant auto : nombre de largeurs"],["cnc","Heure CNC (DH/h)"],["mo","Heure main-d'œuvre (DH/h)"],["tva","TVA (%)"]];

let db=null, products={}, prix={...DEF_PRIX}, current=null, dirty=new Set(), timers={}, saving=0;

function setStatus(kind,text){$("#dot").className="dot "+kind;$("#statusText").textContent=text}

function cost(p,teinte){
  const k=1+prix.chute/100; let c22=0,c40=0; const mats={};
  for(const r of p.pieces||[]){
    const a=num(r.qte)*num(r.long)*num(r.larg)/1e6, mat=resolveMat(r,teinte);
    const o=mats[mat]||(mats[mat]={m2:0,dh:0,manque:!matOf(mat)||!m2Price(mat)});
    o.m2+=a; o.dh+=a*m2Price(mat)*k;
    c22+=num(r.qte)*ch22(r); c40+=num(r.qte)*ch40(r);
  }
  const matiere=Object.values(mats).reduce((s,o)=>s+o.dh,0), m2=Object.values(mats).reduce((s,o)=>s+o.m2,0);
  const chant=c22*prix.chant22+c40*prix.chant40;
  const fourn=(p.fournitures||[]).reduce((s,f)=>s+num(f.qte)*puOf(f),0);
  const machine=num(p.cnc)*prix.cnc/60, mo=num(p.mo)*prix.mo/60, emb=num(p.emballage);
  const cr=matiere+chant+fourn+machine+mo+emb;
  const ttc=priceOf(p,teinte), ht=ttc/(1+prix.tva/100);
  const liv=(p.livraison==null||p.livraison==="")?num(prix.livraison):num(p.livraison), prodLiv=cr+liv, mkEst=num(p.mkEst);
  const mkReel=num(p.mkVentes)>0?num(p.mkBudget)/num(p.mkVentes):null;
  const totEst=prodLiv+mkEst, margeEst=ht-totEst, totReel=mkReel==null?null:prodLiv+mkReel, margeReel=mkReel==null?null:ht-totReel;
  const marge=margeEst;
  return {mats,m2,c22,c40,matiere,chant,fourn,machine,mo,emb,cr,liv,prodLiv,mkEst,mkReel,totEst,totReel,margeEst,margeReel,
          margeProd:ht-prodLiv,ttc,ht,marge,pct:ht?margeEst/ht:0,pctReel:ht&&margeReel!=null?margeReel/ht:null};
}

function dimsOf(p,id){if(id!=="LUNE")return p.dims||"";const pcs=p.pieces||[];const pan=pcs.find(r=>/demi|lune|panneau/i.test(r.nom||""));const tab=pcs.find(r=>/tablette/i.test(r.nom||""));
  if(!pan)return p.dims||"";const W=Math.max(num(pan.larg),tab?num(tab.long):0),D=18+(tab?num(tab.larg):0);return `${fmt0(W)} × ${fmt0(num(pan.long))} × ${fmt0(D)} mm`}
function visOf(p,id,t){const v=(p.visuels)||VIS[id]||[];const i=(p.teintes||[]).indexOf(t);return v[i>=0&&i<v.length?i:0]}
function sortedIds(){return Object.keys(products).sort((a,b)=>(products[a].ordre||0)-(products[b].ordre||0))}
function tabBtn(key,label){return el("button",{role:"tab","aria-selected":String(current===key),onclick:()=>{current=key;renderTabs();renderView()}},label)}
function renderTabs(){
  const nav=$("#tabs");nav.textContent="";
  if(UNLOCK)nav.append(tabBtn("__recap","Récapitulatif"),tabBtn("__prix","Prix fournitures"));
  nav.append(tabBtn("__cmd","Commande atelier"));
  let last=null;
  for(const id of sortedIds()){
    const c=products[id].collection||"Autres";
    if(c!==last){nav.append(el("span",{class:"brk"}),el("span",{class:"grp"},c));last=c}
    nav.append(tabBtn(id,products[id].nom||id));
  }
}
function schedule(id){
  dirty.add(id);clearTimeout(timers[id]);setStatus("busy","Modifications non enregistrées…");
  timers[id]=setTimeout(()=>save(id),900);
}
async function save(id){
  if(!db){setStatus("err","Base indisponible");return}
  if(!UNLOCK){dirty.delete(id);return}
  saving++;setStatus("busy","Enregistrement…");
  try{
    if(id==="__prix")await db.doc("reglages/prix").set({...prix});
    else{const {id:_,...body}=products[id];await db.doc("produits/"+id).set(JSON.parse(JSON.stringify(body)))}
    dirty.delete(id);
  }catch(e){setStatus("err","Échec de l'enregistrement : "+(e&&e.message||"réessayez"));saving--;return}
  saving--; if(!saving&&!dirty.size)setStatus("ok","Enregistré");
}

function numInput(val,onv,cls="w-n",step="any",label){return el("input",{type:"number",step,class:cls,value:val??"","aria-label":label,oninput:e=>onv(e.target.value)})}
function txtInput(val,onv,cls="w-name",label){return el("input",{type:"text",class:cls,value:val??"","aria-label":label,oninput:e=>onv(e.target.value)})}

function renderPrix(){
  const v=$("#view");v.textContent="";
  if(!Array.isArray(prix.matieres)||!prix.matieres.length)prix.matieres=JSON.parse(JSON.stringify(MATS()));
  const sv=()=>schedule("__prix");
  const tb=el("tbody");
  prix.matieres.forEach((m,i)=>{
    const pm=el("td",{class:"num"});
    const upd=()=>{const s=num(m.L)*num(m.H)/1e6;pm.textContent=s&&num(m.prix)?fmt(num(m.prix)/s):"prix manquant"};
    tb.append(el("tr",{},
      el("td",{},txtInput(m.nom,x=>{m.nom=x;sv()},"w-name","Nom de la matière")),
      el("td",{},numInput(m.ep,x=>{m.ep=num(x);sv()},"w-n","any","Épaisseur mm")),
      el("td",{},numInput(m.L,x=>{m.L=num(x);upd();sv()},"w-s","any","Longueur plaque mm")),
      el("td",{},numInput(m.H,x=>{m.H=num(x);upd();sv()},"w-s","any","Largeur plaque mm")),
      el("td",{},numInput(m.prix,x=>{m.prix=num(x);upd();sv()},"w-s","any","Prix de la plaque DH")),

function makeDb(){
  const subs=[];let timer=null,busy=false;
  async function poll(){
    if(busy)return;busy=true;
    try{
      const rows=await sbReq('zwaq_docs?select=coll,id,data,updated_at');
      const by={};for(const r of rows)(by[r.coll]=by[r.coll]||[]).push(r);
      for(const s of subs){
        const list=by[s.coll]||[];
        if(s.id){const r=list.find(x=>x.id===s.id),v=r?r.updated_at:'-';if(s.seen===v)continue;s.seen=v;s.cb({exists:!!r,data:()=>r?r.data:undefined});}
        else{const now={},ch=[];
          for(const r of list){now[r.id]=r.updated_at;if(s.seen[r.id]!==r.updated_at)ch.push({type:s.seen[r.id]?'modified':'added',doc:{id:r.id,data:()=>r.data}});}
          for(const id in s.seen)if(!(id in now))ch.push({type:'removed',doc:{id,data:()=>undefined}});
          s.seen=now;if(ch.length||!s.first){s.first=true;s.cb({empty:!list.length,docChanges:()=>ch});}}
      }
    }catch(e){subs.forEach(s=>s.err&&s.err(e));}
    busy=false;
  }
  const kick=()=>{clearTimeout(timer);timer=setTimeout(poll,30);};
  setInterval(()=>{if(!document.hidden)poll();},20000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll();});
  return{
    doc(path){const [coll,id]=path.split('/');return{
      set:async data=>{await sbReq('zwaq_docs?on_conflict=coll,id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({coll,id,data,updated_at:new Date().toISOString()})});},
      delete:async()=>{await sbReq('zwaq_docs?coll=eq.'+encodeURIComponent(coll)+'&id=eq.'+encodeURIComponent(id),{method:'DELETE'});kick();},
      onSnapshot(cb,err){subs.push({coll,id,cb,err,seen:null});kick();}};},
    collection(coll){return{onSnapshot(cb,err){subs.push({coll,cb,err,seen:{}});kick();}};}
  };
}

/* ================= Fiche atelier ZWAQ : débit, plan de découpe, impression ================= */
const KERF=4,TRIM=10;
let CMD;try{CMD=JSON.parse(localStorage.getItem('zwaq_cmd'))}catch(e){}
if(!CMD||!Array.isArray(CMD.lignes))CMD={nom:'',lignes:[],sens:false};
const saveCmd=()=>{try{localStorage.setItem('zwaq_cmd',JSON.stringify(CMD))}catch(e){}};
let ONE={q:1,t:null,sens:false};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const epOf=m=>num((matOf(m)||{}).ep)||18;
const plateOf=m=>{const o=matOf(m)||{};return[num(o.L)||2800,num(o.H)||2100];};
const lettre=i=>String.fromCharCode(65+i%26)+(i>=26?Math.floor(i/26):'');
const f2=v=>v.toFixed(2).replace('.',',');

function buildDebit(lignes){
  const rows=[];
  lignes.forEach((ln,i)=>{const p=products[ln.id];if(!p||!num(ln.q))return;const t=ln.t||(p.teintes||[])[0]||'';let j=0;
    for(const r of p.pieces||[]){if(!num(r.qte))continue;j++;const m=resolveMat(r,t)||'?';const q=num(r.qte)*num(ln.q);
      rows.push({lab:lettre(i)+j,prod:p.nom||ln.id,piece:r.nom||'',q,L:num(r.long),l:num(r.larg),mat:m,ep:epOf(m),c22:ch22(r)*q,c40:ch40(r)*q});}});
  return rows;
}
function nestZ(rows,mat,sens){
  const [w0,h0]=plateOf(mat),PL={w:w0,h:h0},PW=PL.w-2*TRIM,PH=PL.h-2*TRIM,items=[],out=[];
  rows.filter(r=>r.mat===mat).forEach(r=>{for(let i=0;i<r.q;i++)items.push({n:r.lab,w:r.L,h:r.l});});
  items.sort((a,b)=>(Math.max(b.w,b.h)-Math.max(a.w,a.h))||(b.w*b.h-a.w*a.h));
  const plates=[],nouv=()=>{const p={free:[{x:0,y:0,w:PW,h:PH}],parts:[],PL};plates.push(p);return p;};
  const tryIn=(pl,it)=>{let best=null;for(const f of pl.free)for(const rot of(sens?[false]:[false,true])){const pw=rot?it.h:it.w,ph=rot?it.w:it.h;
    if(pw<=f.w+.01&&ph<=f.h+.01){const sc=Math.min(f.w-pw,f.h-ph);if(!best||sc<best.sc)best={pl,f,rot,pw,ph,sc};}}return best;};
  for(const it of items){
    if(!it.w||!it.h){out.push(it);continue;}
    let best=null;for(const pl of plates){const b=tryIn(pl,it);if(b&&(!best||b.sc<best.sc))best=b;}
    if(!best){const pl=nouv();best=tryIn(pl,it);if(!best){plates.pop();out.push(it);continue;}}
    const {pl,f,rot,pw,ph}=best;pl.parts.push({x:f.x,y:f.y,w:pw,h:ph,n:it.n,rot});pl.free.splice(pl.free.indexOf(f),1);
    const rw=f.w-pw-KERF,bh=f.h-ph-KERF;let a,b;
    if(f.w-pw<f.h-ph){a={x:f.x+pw+KERF,y:f.y,w:rw,h:ph};b={x:f.x,y:f.y+ph+KERF,w:f.w,h:bh};}
    else{a={x:f.x+pw+KERF,y:f.y,w:rw,h:f.h};b={x:f.x,y:f.y+ph+KERF,w:pw,h:bh};}
    [a,b].forEach(z=>{if(z.w>20&&z.h>20)pl.free.push(z);});
  }
  const used=plates.reduce((s,p)=>s+p.parts.reduce((t,q)=>t+q.w*q.h,0),0);
  return{mat,PL,plates,out,rend:plates.length?used/(plates.length*PL.w*PL.h):0,count:items.length};
}
function plateSVGz(pl,W=560){
  const PL=pl.PL,s=W/PL.w,H=PL.h*s,X=x=>(x+TRIM)*s,Y=y=>(y+TRIM)*s;
  let o=`<rect x="0.8" y="0.8" width="${W-1.6}" height="${H-1.6}" fill="#fff" stroke="#222" stroke-width="1.4"/>`;
  pl.free.forEach(f=>{if(f.w>60&&f.h>60)o+=`<path d="M${X(f.x)} ${Y(f.y)}L${X(f.x+f.w)} ${Y(f.y+f.h)}M${X(f.x+f.w)} ${Y(f.y)}L${X(f.x)} ${Y(f.y+f.h)}" stroke="#bbb" stroke-width=".6" fill="none"/>`;});
  pl.parts.forEach(p=>{const x=X(p.x),y=Y(p.y),w=p.w*s,h=p.h*s;
    o+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#F1E4D3" stroke="#222" stroke-width=".9"/>`;
    const fs=Math.max(7,Math.min(12,Math.min(w,h)/2.4));
    if(w>=12&&h>=10)o+=`<text x="${x+w/2}" y="${y+h/2+(w>=60&&h>=34?-2:fs*.35)}" text-anchor="middle" font-size="${fs}" font-weight="700" font-family="IBM Plex Sans,sans-serif" fill="#111">${esc(p.n)}</text>`;
    if(w>=60&&h>=34)o+=`<text x="${x+w/2}" y="${y+h/2+11}" text-anchor="middle" font-size="8.5" font-family="IBM Plex Mono,monospace" fill="#333">${fmt0(p.rot?p.h:p.w)}×${fmt0(p.rot?p.w:p.h)}</text>`;});
  return`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block">${o}</svg>`;
}
function nestAll(rows,sens){return[...new Set(rows.map(r=>r.mat))].map(m=>nestZ(rows,m,sens));}

function plansBlock(res){

  const th=`<thead><tr><th>N°</th><th>Produit · المنتج</th><th>Pièce · القطعة</th><th>Qté · العدد</th><th>Long. · الطول</th><th>Larg. · العرض</th><th>Ép.</th><th>Matière · المادة</th><th>Chant 22 · سينتا (m)</th><th>Chant 40 · سينتا (m)</th><th>✓</th></tr></thead>`;
  const tot={n:rows.reduce((s,r)=>s+r.q,0),c22:rows.reduce((s,r)=>s+r.c22,0),c40:rows.reduce((s,r)=>s+r.c40,0)};

  if(sepP){const cards=prods.split('<div class="pp">').slice(1).map(x=>'<div class="pp">'+x);

      <h4>Liste de débit · لائحة التقطيع <small>cotes en mm</small></h4><table class="dt">${th}<tbody>${ch.map(tr).join('')}</tbody>
      ${last?`<tfoot><tr><td></td><td>Total</td><td></td><td class="r b">${tot.n}</td><td></td><td></td><td></td><td></td><td class="r">${f2(tot.c22)}</td><td class="r">${f2(tot.c40)}</td><td></td></tr></tfoot>`:''}</table>
      ${last?`<div class="sig">Fabriqué par : ____________ &nbsp; Date : ________ &nbsp; Contrôlé par : ____________</div>`:''}</div>`);});
  // pages plans de découpe : 2 plaques par page
  for(const r of res){for(let i=0;i<r.plates.length;i+=2){
    const two=r.plates.slice(i,i+2).map((pl,j)=>`<div class="pl"><div class="pcap">Plaque ${i+j+1} / ${r.plates.length}</div>${plateSVGz(pl,560)}</div>`).join('');
    pages.push(`<div class="sheet">${head('Plan de découpe · مخطط التقطيع')}<h4>${esc(r.mat)} · ${epOf(r.mat)} mm · plaque ${r.PL.w} × ${r.PL.h} <small>${r.plates.length} plaque(s) · ${Math.round(r.rend*100)} % utilisé · scie ${KERF} mm · délignage ${TRIM} mm</small></h4>
      ${r.out.length?`<p class="warnp">Trop grand pour la plaque : ${esc([...new Set(r.out.map(o=>o.n))].join(', '))}</p>`:''}<div class="pls ${r.plates.length-i===1?'one':''}">${two}</div></div>`);}}
  $('#printArea').innerHTML=pages.join('');
  const imgs=[...$('#printArea').querySelectorAll('img')];
  Promise.all(imgs.map(im=>im.complete?1:new Promise(ok=>{im.onload=im.onerror=ok;}))).then(()=>window.print());
}

(async()=>{
  db=makeDb(); current="__cmd"; renderLock(); renderTabs();
  setStatus("busy","Chargement…");
  db.doc("reglages/prix").onSnapshot(s=>{
    const typing=!!document.activeElement?.closest?.("#view");
    if(dirty.has("__prix")||(current==="__prix"&&typing))return;
    prix={...DEF_PRIX,...JSON.parse(JSON.stringify(s.exists?s.data():{}))};
    if(current==="__prix"){if(!document.activeElement?.closest?.("#view"))renderPrix()} else if(current==="__recap")renderRecap(); else if(current)renderSummary();
  },e=>setStatus("err","Connexion perdue : rechargez la page"));
  db.collection("produits").onSnapshot(snap=>{
    for(const ch of snap.docChanges()){
      const id=ch.doc.id;
      if(ch.type==="removed"){delete products[id];continue}
      if(dirty.has(id))continue;
      if(id===current&&document.activeElement?.closest?.("#view")&&products[id])continue;
      products[id]={id,...JSON.parse(JSON.stringify(ch.doc.data()))};
    }
    if(!current||(!products[current]&&!current.startsWith("__")))current=UNLOCK?"__recap":"__cmd";
    renderTabs();
    const typing=document.activeElement&&document.activeElement.closest&&document.activeElement.closest("#view");
    if(!typing)renderView();
    if(!dirty.size&&!saving)setStatus("ok",snap.empty?"Aucune fiche enregistrée":"À jour");
  },e=>setStatus("err","Connexion perdue : rechargez la page"));
})();
</script>
